# Seul chemin de déploiement : le build Netlify déclenché par Git (base directory
# = "web" dans Netlify UI > Build settings). Pas de deploy depuis GitHub Actions.
# - Deploy previews (PR) : build seul, pour que la preview existe même si le lint
#   échoue. Lint et tests tournent sur la PR via .github/workflows/verification.yml.
# - Production (push sur main) : lint et tests d'abord ; un échec annule la mise
#   en ligne et la version précédente reste publiée.
[build]
  command = "npm run build"
  publish = "dist"

[context.production]
  command = "npm run lint && npm run test && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms https://assets.calendly.com; frame-src https://calendly.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; img-src 'self' data: https://images.unsplash.com https://plus.unsplash.com https://assets.calendly.com https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; font-src https://fonts.gstatic.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
