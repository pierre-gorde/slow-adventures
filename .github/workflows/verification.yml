name: 🔍 Vérification du site

# La mise en ligne est faite par Netlify (build Git, voir web/netlify.toml),
# qui relance lint + tests avant chaque déploiement de prod. Ce workflow donne
# leur résultat sur la PR, avant le merge.
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/verification.yml'

jobs:
  verification:
    name: 🔍 Lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ⚙️ Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🧹 Vérifier la qualité du code
        run: npm run lint

      - name: 🧪 Lancer les tests
        run: npm run test
